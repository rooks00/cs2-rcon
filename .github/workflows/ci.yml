name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan all fetched history without printing secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts="--all" .'

  verify:
    strategy:
      matrix:
        node: [24, 26]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify the adapter build used by hosted platforms
        run: NEXT_ADAPTER_PATH="$PWD/scripts/adapter-smoke.mjs" VERCEL=1 npm run build

  helper:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test the native helper
        working-directory: helper
        run: go test -race ./...
      - name: Check repeated map-change disconnects
        working-directory: helper
        run: go test -race -run TestTransitionDisconnect -count=50 ./...
